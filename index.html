<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ECE6DB" />
    <meta name="description" content="StoaFit · Templanza en cada comida. Registrá lo que comés, tu agua y tu progreso." />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <title>StoaFit</title>
    <script>
      try {
        var t = localStorage.getItem('stoafit-tema') || 'oscuro';
        var o = t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = o ? 'dark' : 'light';
        document.documentElement.dataset.acento = localStorage.getItem('stoafit-acento') || 'oliva';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
